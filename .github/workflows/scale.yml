name: Scale sweep

# The per-push CI is deliberately small: it must finish in a minute or two, so
# it never touches 10^6 neurons. This workflow is the other half — it runs the
# opt-in `--scale` sweep on a schedule so the large-population numbers are
# refreshed somewhere, without making every PR wait for them.
#
# It is a measurement, not a gate. There is no pass/fail threshold: the job
# fails only if the sweep itself errors, because a broken harness is worth
# knowing about. Nothing here asserts on wall-clock time (see
# docs/benchmarks/README.md for why timings are recorded for humans, not
# asserted for machines).

on:
  schedule:
    # Weekly, Monday 04:17 UTC. Off the hour so it does not contend with the
    # cron herd.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale:
    name: scale sweep to 10^6 neurons
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package with no extras
        # The sweep exercises the NumPy and event-driven paths only, so a base
        # install is enough. This also keeps the memory profile honest: no
        # optional backend is resident and inflating peak RSS.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the scale sweep
        run: python scripts/benchmark.py --scale --markdown

      - name: Upload the sweep
        uses: actions/upload-artifact@v4
        with:
          name: scale-sweep
          path: docs/benchmarks/scale.json
