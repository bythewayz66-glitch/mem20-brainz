name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        # Base install only: numba is an optional extra, and the package must
        # work without it. The numba job below covers the JIT path.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # httpx is in the dev extra, but it is named explicitly here because
          # fastapi.testclient needs it at *collection* time: without it the
          # whole run aborts with a collection error rather than skipping.
          pip install "httpx>=0.27"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Guard against gutted test modules
        # A commit that empties a test module still passes `pytest` — the module
        # just collects nothing. Fail when a module collects no tests, or when
        # the suite shrinks past the floor in scripts/check_test_collection.py.
        run: python scripts/check_test_collection.py

      - name: Run slow equivalence tests
        # The 10^4-neuron bit-identity case. Kept as a separate step so a
        # failure is unambiguous in the job log.
        run: pytest -q -m slow

  numpy-only:
    name: base install, numpy only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package with no extras
        # pyproject.toml promises the package installs and runs with numpy
        # alone. This job is the test of that promise: no [dev], no [server],
        # no [numba], no [jax]. pytest is added back explicitly because it is a
        # test runner, not an optional runtime backend.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Assert no optional dependency leaked in
        # A base install that quietly drags in fastapi or numba would make the
        # "numpy alone" claim false without any test failing.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import importlib.util

          import numpy
          import mem20_brainz  # the base package must import

          requires = md.requires("mem20-brainz") or []
          # Extras are listed with an `extra == "..."` marker; only the
          # unconditional requirements are what a plain `pip install` pulls in.
          base = [r for r in requires if "extra ==" not in r]
          assert base and all(r.lower().startswith("numpy") for r in base), (
              f"base install requires more than numpy: {base}"
          )
          leaked = [
              name
              for name in ("numba", "jax", "fastapi", "uvicorn", "matplotlib")
              if importlib.util.find_spec(name) is not None
          ]
          assert not leaked, f"optional dependencies leaked into the base install: {leaked}"
          print(f"numpy {numpy.__version__}; base requires {base}; no extras present")
          PY

      - name: Run the suite that needs only numpy
        # test_server.py is excluded: it imports fastapi, which is an extra by
        # design. The jax and numba modules skip themselves via importorskip,
        # so the two skips below are expected here.
        run: pytest -q --ignore=tests/test_server.py -rs

  server:
    name: observability server (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with the server extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Verify the server extra is actually installed
        # Without this, a broken extra would turn the server tests into
        # collection errors that could be mistaken for an environment problem.
        run: python -c "import fastapi, uvicorn, httpx; print('fastapi', fastapi.__version__)"

      - name: Run readout and server tests
        run: pytest -q tests/test_readout.py tests/test_server.py

      - name: Run the headless mode
        # Proves the observability layer works without a browser, which is the
        # whole point of having a headless path.
        run: python -m mem20_brainz.server.headless --steps 120 --stimulus threat --every 40

  frontend:
    name: frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        run: npm run build

  numba:
    name: numba backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with the numba extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,numba]"

      - name: Verify numba is actually installed
        # Without this, a broken extra would silently turn the numba tests into
        # skips and the job would pass while testing nothing.
        run: python -c "import numba; print('numba', numba.__version__)"

      - name: Run numba equivalence tests
        run: pytest -q tests/test_numba_equivalence.py -rs

      - name: Run numba slow case
        run: pytest -q -m slow tests/test_numba_equivalence.py

  jax:
    name: jax backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with the jax extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jax]"

      - name: Verify jax is actually installed
        # Without this, a broken extra would silently turn the jax tests into
        # skips and the job would pass while testing nothing.
        run: python -c "import jax; print('jax', jax.__version__)"

      - name: Run jax equivalence tests
        # -rs so any skip is printed with its reason, making a silent skip
        # visible in the log rather than hidden in a summary line.
        run: pytest -q tests/test_jax_backend.py -rs

      - name: Run the parameter-fitting example
        # The fit is the point of this backend, so CI proves it converges
        # rather than only that the module imports.
        run: python scripts/fit_jax_example.py

  benchmark:
    name: benchmark baseline is current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with the numba extra
        # The baseline records a numba row, so the extra is needed for the
        # comparison to be like-for-like.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,numba]"

      - name: Check the committed baseline is not stale
        # Fails if the benchmark config, package version, or any path's spike
        # count has changed. Timings are deliberately not asserted on: they vary
        # run to run and would make this job flaky.
        run: python scripts/benchmark.py --check
