[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20-brainz"
version = "0.0.1"
description = "Scaffold for a whole-brain neuron replication project (86B neurons / 100T synapses). Pre-alpha: no brain is simulated yet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mem20-brainz contributors" }]
keywords = ["neuroscience", "connectome", "simulation", "computational-neuroscience"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
viz = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/bythewayz66-glitch/mem20-brainz"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
