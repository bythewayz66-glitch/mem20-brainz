[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20-brainz"
version = "0.0.1"
description = "Scaffold for a whole-brain neuron replication project (86B neurons / 100T synapses). Pre-alpha: no brain is simulated yet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mem20-brainz contributors" }]
keywords = ["neuroscience", "connectome", "simulation", "computational-neuroscience"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4,<0.18"]
viz = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/bythewayz66-glitch/mem20-brainz"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: slower equivalence cases (10^4 neurons); deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Ruff formats embedded Python inside Markdown code fences. The docs contain
# illustrative snippets (e.g. a Protocol sketch in ADR-0003) that are not meant
# to be reformatted, so Markdown is excluded from lint and format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# An explicit rule set, so CI does not change behaviour when ruff's defaults
# drift between releases.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  # Scripts carry a shebang but the GitHub API cannot set the executable bit,
  # so this rule would fail CI for a reason unrelated to the code.
  "EXE001",
]

[tool.ruff.lint.isort]
known-first-party = ["mem20_brainz"]
